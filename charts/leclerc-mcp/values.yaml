replicaCount: 1

image:
  repository: ghcr.io/jzacharie/leclerc-mcp
  pullPolicy: Always
  tag: "latest"

# The GHCR package is private: reference a docker-registry secret to pull it.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-dns
    gethomepage.dev/description: Leclerc Drive MCP Server
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: MCP
    gethomepage.dev/icon: mdi-cart-arrow-down
    gethomepage.dev/name: Leclerc MCP
    gethomepage.dev/ping: https://leclerc-mcp.p.zacharie.org/health
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: leclerc-mcp.p.zacharie.org
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls:
    - secretName: leclerc-mcp-tls
      hosts:
        - leclerc-mcp.p.zacharie.org

env:
  BIND_ADDR: "0.0.0.0:8080"
  BROWSERLESS_WS_URL: "ws://browserless-chrome.browserless-chrome.svc.cluster.local:3000"
  LECLERC_STORE_URL: "https://fd7-courses.leclercdrive.fr"
  LECLERC_STORE_ID: "166902"
  LECLERC_BROWSER_MODE: "connect"
  LECLERC_INJECT_COOKIES: "true"
  RUST_LOG: "leclerc_mcp=info,tower_http=info"

# ExternalSecrets integration with Vault
externalSecret:
  enabled: true
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  targetSecretName: leclerc-mcp-secrets
  vaultKey: "apps/productivity/leclerc-mcp"
  data:
    - secretKey: LECLERC_COOKIES_JSON
      remoteProperty: leclerc_cookies

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
