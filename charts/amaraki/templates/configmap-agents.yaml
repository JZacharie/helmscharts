{{- range $key, $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $agent.name }}
  namespace: {{ $.Release.Namespace | default "amaraki" }}
  labels:
    type: opencode-agent-config
    app.kubernetes.io/name: {{ $.Chart.Name }}
data:
  agent.json: |
    {
      "name": {{ $agent.name | quote }},
      "description": {{ $agent.description | quote }},
      "model": {{ $agent.model | quote }},
      "system_prompt": {{ $agent.systemPrompt | toJson }},
      "mcp_servers": {{ $agent.mcpServers | default list | toJson }},
      "max_iterations": {{ $agent.maxIterations | default 10 }},
      "env": {{ $agent.env | default dict | toJson }},
      "skills": {{ $agent.skills | default list | toJson }},
      "git_repos": {{ $agent.gitRepos | default list | toJson }},
      "engine": {{ $agent.engine | default "opencode" | quote }},
      "thinking": {{ $agent.thinking | default "Medium" | quote }}
    }
{{- end }}
{{- end }}
