apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebrowser-quantum.fullname" . }}
  labels:
    {{- include "filebrowser-quantum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.dropApi.enabled }}
    - port: {{ .Values.dropApi.port | default 8081 }}
      targetPort: drop
      protocol: TCP
      name: drop
    {{- end }}
  selector:
    {{- include "filebrowser-quantum.selectorLabels" . | nindent 4 }}
