replicaCount: 1

imagePullSecrets: []

image:
  repository: ghcr.io/jzacharie/amaraki
  pullPolicy: IfNotPresent
  tag: "latest"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

agentRunnerImage:
  repository: ghcr.io/jzacharie/opencode-agent
  tag: "latest"

secrets:
  existingSecret: "aramaki-slack-credentials"
  slackBotTokenKey: "SLACK_BOT_TOKEN"
  slackSigningSecretKey: "SLACK_SIGNING_SECRET"
  slackAppTokenKey: "SLACK_APP_TOKEN"

serviceAccount:
  create: true
  name: aramaki-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aramaki.local
      paths:
        - path: /
          pathType: ImplementationSpecific

agents:
  codeReviewer:
    enabled: true
    name: agent-code-reviewer
    description: "Analyse le code et propose des optimisations"
    model: "opencode/free-default-model"
    systemPrompt: "Tu es un expert en revue de code Rust et Kubernetes sur le cluster Jo3 sous le commandement d'Aramaki."
    maxIterations: 5
    mcpServers:
      - name: filesystem
        command: npx
        args: ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]
      - name: git
        command: npx
        args: ["-y", "@modelcontextprotocol/server-git"]
